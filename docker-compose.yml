version: "3.9"
services:

  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/backend
    environment:
      FLASK_ENV: development
    networks:
      - app-network


  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/frontend
    networks:
      - app-network

  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:latest
    restart: always
    ports:
      - "8000:8000"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/config/pwfile:/mosquitto/config/pwfile
      - ./mosquitto/log:/mosquitto/log
      - ./mosquitto/data:/mosquitto/data
    security_opt:
      - no-new-privileges:true
    networks:
      - app-network 

volumes:
  db_data: # Volume pour une future base de données

networks:
  app-network:
    driver: bridge