version: "3.9"
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      FLASK_ENV: development
    networks:
      - app-network
    container_name: backend


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/frontend
    networks:
      - app-network
    container_name: frontend


volumes:
  db_data: # Volume pour une future base de données

networks:
  app-network:
    driver: bridge